
name: Vercel Deployment Email

on:
  push:
    branches:
      - staging

  repository_dispatch:
    types:
      - vercel.deployment.success
      - vercel.deployment.error
      - vercel.deployment.failed
      - vercel.deployment.canceled
      - vercel.deployment.promoted
      - vercel.deployment.ready
      - vercel.deployment.pending
      - vercel.deployment.ignored
      - vercel.deployment.skipped

  workflow_dispatch:



permissions:
  contents: read

jobs:
  send-email:
    runs-on: ubuntu-latest

    steps:
      - name: Send deployment report to Gmail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_APP_PASSWORD }}
          to: ${{ secrets.SMTP_USER }}
          from: 'Vercel Deployment Reports <${{ secrets.SMTP_USER }}>'
          subject: '[Vercel] ${{ github.event.action || ''Manual test'' }} - ${{ github.event.client_payload.project.name || github.repository }}'
          html_body: |
            <h2>Vercel Deployment Report</h2>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Project:</b> ${{ github.event.client_payload.project.name || 'Not provided (manual test)' }}</p>
            <p><b>Event:</b> ${{ github.event.action || 'Manual test' }}</p>
            <p><b>Deployment status:</b> ${{ github.event.client_payload.state.type || 'Manual test — no deployment status' }}</p>
            <p><b>Environment:</b> ${{ github.event.client_payload.environment || 'Not provided' }}</p>
            <p><b>Branch:</b> ${{ github.event.client_payload.git.ref || 'Not provided' }}</p>
            <p><b>Commit:</b> ${{ github.event.client_payload.git.shortSha || 'Not provided' }}</p>
            <p><b>Commit SHA:</b> ${{ github.event.client_payload.git.sha || 'Not provided' }}</p>
            <p><b>Deployment URL:</b>
            <a href="${{ github.event.client_payload.url || 'https://vercel.com' }}">Open deployment</a></p>
            <p><b>Deployment ID:</b> ${{ github.event.client_payload.id || 'Not provided' }}</p>
            <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View GitHub workflow logs</a></p>
