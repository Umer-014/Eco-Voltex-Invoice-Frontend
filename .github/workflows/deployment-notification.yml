
name: Vercel Deployment Email

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
      - vercel.deployment.error
      - vercel.deployment.failed
      - vercel.deployment.canceled
      - vercel.deployment.promoted
      - vercel.deployment.ready
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send deployment report to Gmail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_APP_PASSWORD }}
          to: ${{ secrets.SMTP_USER }}
          from: Vercel Deployment Reports &lt;${{ secrets.SMTP_USER }}&gt;
          subject: >-
            [Vercel] ${{ github.event.action || 'Manual test' }}
            - ${{ github.event.client_payload.name || github.repository }}
          html_body: |
            &lt;h2&gt;Vercel Deployment Report&lt;/h2&gt;
            &lt;p&gt;&lt;b&gt;Repository:&lt;/b&gt; ${{ github.repository }}&lt;/p&gt;
            &lt;p&gt;&lt;b&gt;Event:&lt;/b&gt; ${{ github.event.action || 'Manual test' }}&lt;/p&gt;
            &lt;p&gt;&lt;b&gt;Project:&lt;/b&gt; ${{ github.event.client_payload.name || 'See deployment details' }}&lt;/p&gt;
            &lt;p&gt;&lt;b&gt;Environment:&lt;/b&gt; ${{ github.event.client_payload.environment || 'Not provided' }}&lt;/p&gt;
            &lt;p&gt;&lt;b&gt;Deployment URL:&lt;/b&gt;
            &lt;a href="https://${{ github.event.client_payload.url }}"&gt;Open deployment&lt;/a&gt;&lt;/p&gt;
            &lt;p&gt;&lt;b&gt;Commit / branch:&lt;/b&gt; See the linked deployment details in Vercel.&lt;/p&gt;
            &lt;p&gt;&lt;a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"&gt;View GitHub workflow logs&lt;/a&gt;&lt;/p&gt;
